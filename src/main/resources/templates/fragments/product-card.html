<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body>
<!-- Product Card Fragment -->
<div th:fragment="productCard(p)" class="card card-hover group flex flex-col h-full overflow-hidden bg-surface relative border border-line/80 rounded-2xl shadow-soft transition-all duration-300">

    <!-- Ảnh sản phẩm & Badge vùng miền/OCOP -->
    <div class="relative w-full aspect-square bg-surface-muted overflow-hidden">
        <a th:href="@{'/products/' + ${p.slug}}" class="block w-full h-full">
            <img th:src="${p.primaryImageUrl != null ? p.primaryImageUrl : '/images/demo/placeholder.svg'}"
                 th:alt="${p.name}"
                 loading="lazy"
                 class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                 th:classappend="${p.stock <= 0} ? 'opacity-50 grayscale' : ''">
        </a>

        <!-- Tag Vùng Miền (Top Left) -->
        <div class="absolute top-2.5 left-2.5 z-10">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold text-white shadow-sm backdrop-blur-sm"
                  th:style="'background-color: ' + (${p.regionColorHex != null ? p.regionColorHex : '#0F9D8A'})">
                <span class="w-1.5 h-1.5 rounded-full bg-white/80 animate-pulse"></span>
                <span th:text="${p.regionName}">Miền Bắc</span>
            </span>
        </div>

        <!-- Huy hiệu OCOP (Top Right) -->
        <div th:if="${p.ocopRating != null and p.ocopRating > 0}" class="absolute top-2.5 right-2.5 z-10">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-gradient-to-r from-amber-400 to-amber-500 text-ink shadow-sm">
                <i data-lucide="award" class="w-3 h-3 text-ink"></i>
                <span th:text="${p.ocopRating} + '★ OCOP'">4★ OCOP</span>
            </span>
        </div>

        <!-- Nút Yêu thích Wishlist (Bottom Right trên ảnh) -->
        <button type="button"
                th:data-wishlist-id="${p.id}"
                th:onclick="'window.toggleWishlistItem && window.toggleWishlistItem(' + ${p.id} + ', this)'"
                class="wishlist-btn absolute bottom-2.5 right-2.5 z-10 w-8 h-8 rounded-full bg-surface/90 backdrop-blur-sm text-ink-muted hover:text-danger hover:bg-surface flex items-center justify-center shadow-sm border border-line/60 transition active:scale-90"
                title="Yêu thích đặc sản"
                aria-label="Yêu thích đặc sản">
            <i data-lucide="heart" class="w-4 h-4"></i>
        </button>

        <!-- Lớp phủ Tạm Hết Hàng (nếu hết hàng) -->
        <div th:if="${p.stock <= 0}" class="absolute inset-0 flex items-center justify-center bg-ink/40 backdrop-blur-[2px] z-20">
            <span class="bg-surface/95 text-ink font-bold text-xs px-3.5 py-1.5 rounded-full shadow-md border border-line">
                Tạm hết hàng
            </span>
        </div>
    </div>

    <!-- Nội dung mô tả thẻ sản phẩm -->
    <div class="p-4 flex flex-col flex-1 justify-between gap-3">
        <div>
            <!-- Xuất xứ Làng nghề / Tỉnh thành -->
            <div class="flex items-center gap-1 text-[11px] text-ink-muted mb-1.5">
                <i data-lucide="map-pin" class="w-3 h-3 text-primary-600 shrink-0"></i>
                <span class="truncate font-medium" th:text="${p.provinceName != null ? p.provinceName : (p.originDetail != null ? p.originDetail : 'Đặc sản Việt Nam')}">
                    Thái Nguyên
                </span>
            </div>

            <!-- Tên sản phẩm (tối đa 2 dòng) -->
            <h4 class="text-xs sm:text-sm font-semibold text-ink line-clamp-2 leading-snug group-hover:text-primary-700 transition">
                <a th:href="@{'/products/' + ${p.slug}}" th:text="${p.name}">
                    Chè Thái Nguyên Tân Cương Thượng Hạng Hộp 500g
                </a>
            </h4>
        </div>

        <div>
            <!-- Đánh giá sao & Số lượng đã bán -->
            <div class="flex items-center gap-1.5 text-[11px] text-ink-muted mb-2">
                <div class="flex items-center text-amber-500 font-semibold">
                    <i data-lucide="star" class="w-3 h-3 fill-amber-400 text-amber-400"></i>
                    <span class="ml-1 text-ink" th:text="${p.avgRating}">4.8</span>
                </div>
                <span class="text-line">•</span>
                <span th:text="'Đã bán ' + ${p.soldCount}">Đã bán 120</span>
            </div>

            <!-- Giá tiền & Nút thêm nhanh vào giỏ -->
            <div class="flex items-center justify-between pt-2 border-t border-line/60">
                <div>
                    <span class="text-sm sm:text-base font-bold text-primary-700 font-serif"
                          th:text="${#numbers.formatDecimal(p.price, 0, 'POINT', 0, 'POINT')} + '₫'">
                        185.000₫
                    </span>
                    <span class="text-[10px] text-ink-muted block -mt-0.5" th:text="'/' + ${p.unit}">/Hộp 500g</span>
                </div>

                <!-- Nút thêm vào giỏ nhanh -->
                <button th:if="${p.stock > 0}"
                        type="button"
                        th:onclick="'quickAddToCart(' + ${p.id} + ')'"
                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-primary-50 text-primary-700 hover:bg-primary-600 hover:text-white flex items-center justify-center transition shadow-2xs active:scale-90"
                        title="Thêm vào giỏ hàng"
                        aria-label="Thêm vào giỏ hàng">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
