<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>
<header th:fragment="header" class="sticky top-0 z-40 bg-surface/95 backdrop-blur-md border-b border-line transition-all duration-200"
        x-data="{ mobileMenuOpen: false, searchOpen: false, accountOpen: false, unreadCount: 0, cartCount: 0 }"
        x-init="
            // Polling số lượng badge giỏ hàng và thông báo
            const fetchCounts = async () => {
                try {
                    const cartRes = await fetch('/api/cart/count');
                    if (cartRes.ok) {
                        const data = await cartRes.json();
                        if (data.success) cartCount = data.data || 0;
                    }
                    const notifRes = await fetch('/api/notifications/unread-count');
                    if (notifRes.ok) {
                        const nData = await notifRes.json();
                        if (nData.success) unreadCount = nData.data.unreadCount || 0;
                    }
                } catch(e) {}
            };
            fetchCounts();
        ">

    <!-- Thanh thông báo trên cùng -->
    <div class="bg-primary-50 text-primary-700 text-xs py-1.5 px-4 text-center border-b border-primary-100 font-medium">
        <span>🌾 Miễn phí vận chuyển tiêu chuẩn cho đơn từ <strong>500.000₫</strong> tại mỗi gian hàng đặc sản</span>
    </div>

    <!-- Header chính -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20 gap-4">

            <!-- Logo -->
            <a th:href="@{/}" class="flex-shrink-0 flex items-center transition hover:opacity-95">
                <img th:src="@{/images/logo.svg}" alt="VietSpecialty Logo" class="h-10 sm:h-12 w-auto">
            </a>

            <!-- Thanh tìm kiếm mở rộng (Desktop) -->
            <div class="hidden md:flex flex-1 max-w-xl mx-4">
                <form th:action="@{/search}" method="GET" class="relative w-full">
                    <input type="text" name="q" placeholder="Tìm đặc sản (nước mắm, chè, mật ong, hạt sen...)"
                           class="w-full pl-11 pr-24 py-2.5 rounded-full border border-line bg-surface-muted text-ink placeholder-ink-muted focus:bg-surface focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 text-sm transition">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <button type="submit" class="absolute inset-y-1 right-1 px-4 rounded-full bg-primary-600 hover:bg-primary-700 text-white text-xs font-medium transition flex items-center gap-1 shadow-sm">
                        <span>Tìm kiếm</span>
                    </button>
                </form>
            </div>

            <!-- Điều hướng & Tác vụ phải -->
            <div class="flex items-center space-x-1 sm:space-x-3">

                <!-- Link Danh mục đặc sản -->
                <a th:href="@{/products}" class="hidden lg:flex items-center gap-1.5 px-3 py-2 rounded-xl text-sm font-medium text-ink hover:bg-surface-muted transition">
                    <i data-lucide="grid" class="w-4 h-4 text-primary-600"></i>
                    <span>Tất cả đặc sản</span>
                </a>

                <!-- Giỏ hàng -->
                <a th:href="@{/cart}" class="relative p-2.5 text-ink hover:bg-surface-muted rounded-xl transition flex items-center" aria-label="Giỏ hàng">
                    <i data-lucide="shopping-bag" class="w-5 h-5 text-ink"></i>
                    <span x-show="cartCount > 0" x-text="cartCount"
                          class="absolute -top-1 -right-1 flex items-center justify-center min-w-5 h-5 px-1.5 text-[11px] font-bold text-white bg-accent-500 rounded-full shadow-sm animate-scale">
                        0
                    </span>
                </a>

                <!-- Chuông thông báo -->
                <div sec:authorize="isAuthenticated()" class="relative" x-data="{ notifOpen: false, notifications: [] }" @click.outside="notifOpen = false">
                    <button @click="
                        notifOpen = !notifOpen;
                        if (notifOpen && notifications.length === 0) {
                            fetch('/api/notifications').then(r=>r.json()).then(d=>{ if(d.success) notifications = d.data; });
                        }
                    " class="relative p-2.5 text-ink hover:bg-surface-muted rounded-xl transition flex items-center focus:outline-none" aria-label="Thông báo">
                        <i data-lucide="bell" class="w-5 h-5 text-ink"></i>
                        <span x-show="unreadCount > 0" x-text="unreadCount"
                              class="absolute -top-1 -right-1 flex items-center justify-center min-w-5 h-5 px-1 text-[10px] font-bold text-white bg-danger rounded-full shadow-sm animate-scale">
                            0
                        </span>
                    </button>

                    <!-- Popover Thông báo -->
                    <div x-show="notifOpen" x-transition
                         class="absolute right-0 mt-2 w-80 sm:w-96 bg-surface rounded-2xl shadow-lift border border-line py-2 z-50 text-xs">
                        <div class="px-4 py-2.5 border-b border-line flex items-center justify-between">
                            <span class="font-bold text-ink">Thông báo mới nhận</span>
                            <button @click="fetch('/api/notifications/read-all', {method: 'POST'}).then(()=>{ unreadCount = 0; notifications.forEach(n=>n.isRead=true); });"
                                    class="text-[11px] text-primary-600 hover:underline font-semibold">
                                Đã đọc tất cả
                            </button>
                        </div>

                        <div class="max-h-80 overflow-y-auto divide-y divide-line/60">
                            <template x-for="item in notifications" :key="item.id">
                                <a :href="item.linkUrl || '#'"
                                   @click="fetch('/api/notifications/' + item.id + '/read', {method: 'POST'})"
                                   class="block px-4 py-3 hover:bg-surface-muted/50 transition-colors"
                                   :class="!item.isRead ? 'bg-primary-50/40' : ''">
                                    <div class="flex items-start justify-between gap-2">
                                        <h5 class="font-bold text-ink text-xs leading-snug" x-text="item.title"></h5>
                                        <span class="text-[10px] text-ink-muted whitespace-nowrap" x-text="item.timeAgo"></span>
                                    </div>
                                    <p class="text-[11px] text-ink-muted mt-1 leading-relaxed line-clamp-2" x-text="item.content"></p>
                                </a>
                            </template>
                            <div x-show="notifications.length === 0" class="py-8 text-center text-ink-muted text-xs">
                                Chưa có thông báo mới nào
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Người dùng chưa đăng nhập -->
                <div sec:authorize="!isAuthenticated()" class="flex items-center gap-2">
                    <a th:href="@{/login}" class="text-sm font-medium text-ink hover:text-primary-600 px-3 py-2 rounded-xl hover:bg-surface-muted transition">
                        Đăng nhập
                    </a>
                    <a th:href="@{/register}" class="hidden sm:inline-flex btn-primary text-xs px-4 py-2">
                        Đăng ký
                    </a>
                </div>

                <!-- Người dùng đã đăng nhập -->
                <div sec:authorize="isAuthenticated()" class="relative" x-data="{ open: false }" @click.outside="open = false">
                    <button @click="open = !open" class="flex items-center gap-2 p-1.5 rounded-xl hover:bg-surface-muted transition focus:outline-none">
                        <div class="w-8 h-8 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-bold text-xs uppercase border border-primary-200">
                            <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1)}">U</span>
                        </div>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-ink-muted hidden sm:block"></i>
                    </button>

                    <!-- Dropdown Menu tài khoản -->
                    <div x-show="open" x-transition
                         class="absolute right-0 mt-2 w-56 bg-surface rounded-2xl shadow-lift border border-line py-2 z-50 text-sm">
                        <div class="px-4 py-2 border-b border-line">
                            <p class="font-semibold text-ink truncate" sec:authentication="name">User</p>
                            <p class="text-xs text-ink-muted">Tài khoản thành viên</p>
                        </div>

                        <a th:href="@{/account/profile}" class="flex items-center gap-2 px-4 py-2.5 text-ink hover:bg-surface-muted transition">
                            <i data-lucide="user" class="w-4 h-4 text-ink-muted"></i>
                            <span>Hồ sơ cá nhân</span>
                        </a>

                        <a th:href="@{/orders}" class="flex items-center gap-2 px-4 py-2.5 text-ink hover:bg-surface-muted transition">
                            <i data-lucide="package" class="w-4 h-4 text-ink-muted"></i>
                            <span>Đơn mua của tôi</span>
                        </a>

                        <!-- Link Kênh người bán nếu là SELLER -->
                        <a sec:authorize="hasRole('SELLER')" th:href="@{/seller/dashboard}" class="flex items-center gap-2 px-4 py-2.5 text-primary-600 font-medium hover:bg-primary-50 transition">
                            <i data-lucide="store" class="w-4 h-4"></i>
                            <span>Kênh người bán</span>
                        </a>

                        <!-- Link Đăng ký mở shop nếu là USER thuần túy -->
                        <a sec:authorize="hasRole('USER') and !hasRole('SELLER')" th:href="@{/account/shop-registration}" class="flex items-center gap-2 px-4 py-2.5 text-secondary-500 font-medium hover:bg-secondary-50 transition">
                            <i data-lucide="store" class="w-4 h-4"></i>
                            <span>Đăng ký mở gian hàng</span>
                        </a>

                        <!-- Link Admin nếu là ADMIN -->
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="flex items-center gap-2 px-4 py-2.5 text-accent-500 font-medium hover:bg-accent-50 transition">
                            <i data-lucide="shield" class="w-4 h-4"></i>
                            <span>Trang quản trị sàn</span>
                        </a>

                        <div class="border-t border-line my-1"></div>

                        <form th:action="@{/logout}" method="POST" class="w-full">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="w-full text-left flex items-center gap-2 px-4 py-2.5 text-danger hover:bg-red-50 transition">
                                <i data-lucide="log-out" class="w-4 h-4"></i>
                                <span>Đăng xuất</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Nút Hamburger Mobile -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 text-ink hover:bg-surface-muted rounded-xl transition">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Ô tìm kiếm Mobile -->
        <div class="md:hidden pb-3">
            <form th:action="@{/search}" method="GET" class="relative w-full">
                <input type="text" name="q" placeholder="Tìm kiếm đặc sản theo tỉnh, tên..."
                       class="w-full pl-10 pr-4 py-2 rounded-xl border border-line bg-surface-muted text-ink placeholder-ink-muted text-sm">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </span>
            </form>
        </div>
    </div>
</header>
</body>
</html>
