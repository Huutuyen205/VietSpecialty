<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(pageTitle, content, extraCss, extraJs)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} != null ? ${pageTitle} : 'Kênh Người Bán - VietSpecialty'">Kênh Người Bán - VietSpecialty</title>
    
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">

    <!-- Vendor Scripts (Local) -->
    <script defer th:src="@{/vendor/alpine.min.js}"></script>
    <script th:src="@{/vendor/lucide.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSRF Meta -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>

    <th:block th:replace="${extraCss}"></th:block>
</head>
<body class="bg-surface-muted text-ink font-sans min-h-screen flex flex-col antialiased"
      x-data="{ sidebarOpen: false }">

    <!-- HEADER KÊNH NGƯỜI BÁN -->
    <header class="bg-surface border-b border-line sticky top-0 z-40">
        <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <!-- Logo & Nút Toggle Sidebar Mobile -->
            <div class="flex items-center gap-3">
                <button type="button" class="lg:hidden text-ink-muted hover:text-ink p-1.5"
                        @click="sidebarOpen = !sidebarOpen">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <a th:href="@{/seller/dashboard}" class="flex items-center gap-2">
                    <img th:src="@{/images/logo.svg}" alt="VietSpecialty" class="w-8 h-8">
                    <div>
                        <span class="font-extrabold text-sm sm:text-base text-primary-700 tracking-tight">VietSpecialty</span>
                        <span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-primary-100 text-primary-800 uppercase">Kênh Người Bán</span>
                    </div>
                </a>
            </div>

            <!-- Shop Info & Links -->
            <div class="flex items-center gap-4 text-xs">
                <a th:href="@{/}" class="hidden sm:flex items-center gap-1.5 text-ink-muted hover:text-primary-700 font-medium">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span>Trang mua sắm</span>
                </a>

                <div class="w-px h-5 bg-line hidden sm:block"></div>

                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-primary-50 text-primary-700 border border-primary-200 flex items-center justify-center font-bold uppercase">
                        <span th:text="${shop != null ? #strings.substring(shop.name, 0, 1) : 'S'}">S</span>
                    </div>
                    <div class="hidden sm:block text-left">
                        <div class="font-bold text-ink truncate max-w-[140px]" th:text="${shop != null ? shop.name : 'Gian hàng'}">Gian hàng</div>
                        <div class="text-[10px] text-success font-medium">● Đang hoạt động</div>
                    </div>
                </div>

                <form th:action="@{/logout}" method="POST" class="inline">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="p-2 text-ink-muted hover:text-danger rounded-lg transition" title="Đăng xuất">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>

        </div>
    </header>

    <!-- BODY CONTAINER: SIDEBAR + MAIN -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">

        <!-- SIDEBAR NGƯỜI BÁN -->
        <aside :class="sidebarOpen ? 'fixed inset-0 z-50 bg-black/50 flex lg:static lg:bg-transparent' : 'hidden lg:block'"
               class="w-64 flex-shrink-0">
            
            <div class="w-64 bg-surface rounded-2xl border border-line p-4 shadow-sm space-y-2 h-full lg:h-auto">
                
                <div class="lg:hidden flex items-center justify-between pb-3 border-b border-line mb-2">
                    <span class="font-bold text-xs text-ink">Danh mục quản lý</span>
                    <button type="button" @click="sidebarOpen = false" class="text-ink-muted p-1">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <nav class="space-y-1 text-xs font-medium">
                    <a th:href="@{/seller/dashboard}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'dashboard'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        <span>Tổng quan Shop</span>
                    </a>

                    <a th:href="@{/seller/orders}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'orders'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
                        <span>Quản lý đơn hàng</span>
                    </a>

                    <a th:href="@{/seller/products}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'products'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="package" class="w-4 h-4"></i>
                        <span>Quản lý sản phẩm</span>
                    </a>

                    <a th:href="@{/seller/reviews}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'reviews'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="star" class="w-4 h-4"></i>
                        <span>Đánh giá từ khách</span>
                    </a>

                    <a th:href="@{/seller/questions}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'questions'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="message-circle-question" class="w-4 h-4"></i>
                        <span>Hỏi đáp sản phẩm</span>
                    </a>

                    <a th:href="@{/seller/vouchers}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'vouchers'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="ticket-percent" class="w-4 h-4"></i>
                        <span>Mã giảm giá Shop</span>
                    </a>

                    <a th:href="@{/seller/revenue}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'revenue'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                        <span>Doanh thu & Đối soát</span>
                    </a>

                    <a th:href="@{/seller/settings}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'settings'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                        <span>Cài đặt gian hàng</span>
                    </a>

                    <a th:href="@{/seller/products/create}"
                       class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                       th:classappend="${activeNav == 'create_product'} ? 'bg-primary-50 text-primary-700 font-bold' : 'text-ink hover:bg-surface-muted'">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Thêm đặc sản mới</span>
                    </a>

                    <div class="pt-3 border-t border-line my-2"></div>

                    <a th:if="${shop != null}" th:href="@{'/shops/' + ${shop.slug}}" target="_blank"
                       class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-ink-muted hover:text-primary-700 hover:bg-surface-muted transition">
                        <div class="flex items-center gap-3">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                            <span>Xem trang Shop</span>
                        </div>
                    </a>
                </nav>

            </div>
        </aside>

        <!-- NỘI DUNG CHÍNH -->
        <main class="flex-1 min-w-0">
            <th:block th:replace="${content}"></th:block>
        </main>

    </div>

    <!-- Core Scripts -->
    <script th:src="@{/js/core/api.js}"></script>
    <script th:src="@{/js/core/toast.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
    <th:block th:replace="${extraJs}"></th:block>
</body>
</html>
