<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(pageTitle, content, extraCss, extraJs)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} != null ? ${pageTitle} : 'Quản Trị Hệ Thống - VietSpecialty'">Quản Trị Hệ Thống - VietSpecialty</title>
    
    <link rel="stylesheet" th:href="@{/static/css/app.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/static/images/logo.svg}">

    <!-- Vendor Scripts (Local) -->
    <script defer th:src="@{/static/vendor/alpine.min.js}"></script>
    <script th:src="@{/static/vendor/lucide.min.js}"></script>
    <!-- Chart.js CDN hoặc inline script -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- CSRF Meta -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>

    <th:block th:replace="${extraCss}"></th:block>
</head>
<body class="bg-surface-muted text-ink font-sans min-h-screen flex flex-col antialiased"
      x-data="{ sidebarOpen: false }">

    <!-- HEADER ADMIN -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
        <div class="px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <div class="flex items-center gap-3">
                <button type="button" class="lg:hidden text-slate-400 hover:text-white p-1.5"
                        @click="sidebarOpen = !sidebarOpen">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>

                <a th:href="@{/admin/dashboard}" class="flex items-center gap-2">
                    <img th:src="@{/static/images/logo.svg}" alt="VietSpecialty" class="w-8 h-8">
                    <div>
                        <span class="font-extrabold text-sm sm:text-base text-white tracking-tight">VietSpecialty</span>
                        <span class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500 text-slate-900 uppercase">Quản Trị Sàn</span>
                    </div>
                </a>
            </div>

            <div class="flex items-center gap-4 text-xs">
                <a th:href="@{/}" class="hidden sm:flex items-center gap-1.5 text-slate-300 hover:text-white font-medium">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    <span>Xem Sàn Mua Sắm</span>
                </a>

                <div class="w-px h-5 bg-slate-700 hidden sm:block"></div>

                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center font-bold">
                        <span>A</span>
                    </div>
                    <div class="hidden sm:block text-left">
                        <div class="font-bold text-white">Quản Trị Viên</div>
                        <div class="text-[10px] text-slate-400">admin@vietspecialty.vn</div>
                    </div>
                    <form th:action="@{/logout}" method="post" class="inline">
                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="p-1.5 text-slate-400 hover:text-rose-400 transition" title="Đăng xuất">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN BODY -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex-shrink-0 flex flex-col justify-between py-6 px-4 fixed inset-y-0 left-0 z-30 transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-200"
               :class="{ 'translate-x-0': sidebarOpen, '-translate-x-full': !sidebarOpen }">
            
            <nav class="space-y-1.5 text-xs font-semibold">
                <a th:href="@{/admin/dashboard}"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                   th:classappend="${activeNav == 'dashboard'} ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Tổng Quan Hệ Thống</span>
                </a>

                <a th:href="@{/admin/shops}"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                   th:classappend="${activeNav == 'shops'} ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                    <i data-lucide="store" class="w-4 h-4"></i>
                    <span>Quản Lý Gian Hàng</span>
                </a>

                <a th:href="@{/admin/vouchers}"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                   th:classappend="${activeNav == 'vouchers'} ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                    <i data-lucide="ticket-percent" class="w-4 h-4"></i>
                    <span>Mã Giảm Giá Sàn</span>
                </a>

                <a th:href="@{/admin/categories}"
                   class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition"
                   th:classappend="${activeNav == 'categories'} ? 'bg-amber-500 text-slate-900 font-bold' : 'text-slate-300 hover:bg-slate-800 hover:text-white'">
                    <i data-lucide="folder-tree" class="w-4 h-4"></i>
                    <span>Danh Mục Đặc Sản</span>
                </a>
            </nav>

            <div class="pt-6 border-t border-slate-800 text-[11px] text-slate-400 space-y-1">
                <p class="font-bold text-slate-300">VietSpecialty v1.0.0</p>
                <p>Đồ án tốt nghiệp CNTT - K23</p>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
            <div class="max-w-7xl mx-auto">
                <!-- Flash messages -->
                <div th:if="${successMessage}" class="mb-5 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-semibold flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="mb-5 p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <th:block th:replace="${content}"></th:block>
            </div>
        </main>
    </div>

    <!-- Backdrop mobile -->
    <div class="fixed inset-0 bg-black/50 z-20 lg:hidden"
         x-show="sidebarOpen"
         @click="sidebarOpen = false"
         x-transition:enter="transition-opacity ease-linear duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-linear duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
    <th:block th:replace="${extraJs}"></th:block>
</body>
</html>
