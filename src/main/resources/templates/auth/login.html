<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Đăng nhập — VietSpecialty</title>
</head>
<body>
<div layout:fragment="content" class="py-10 max-w-md mx-auto">
    <div class="card p-8 bg-surface shadow-lift">
        <!-- Header form -->
        <div class="text-center mb-6">
            <h1 class="font-serif text-2xl font-bold text-ink">Đăng nhập tài khoản</h1>
            <p class="text-xs text-ink-muted mt-1">Chào mừng bạn quay lại với sàn đặc sản VietSpecialty</p>
        </div>

        <!-- Thông báo thành công / lỗi -->
        <div th:if="${successMessage}" class="mb-4 p-3 rounded-xl bg-primary-50 border border-primary-200 text-xs text-primary-700 flex items-center gap-2">
            <i data-lucide="check-circle" class="w-4 h-4 text-primary-600 flex-shrink-0"></i>
            <span th:text="${successMessage}">Thông báo thành công</span>
        </div>
        <div th:if="${errorMessage}" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-danger flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 text-danger flex-shrink-0"></i>
            <span th:text="${errorMessage}">Email hoặc mật khẩu không chính xác</span>
        </div>

        <!-- Nút Đăng nhập bằng Google -->
        <div class="mb-5">
            <a th:href="@{/auth/google(mode='login')}"
               id="btn-google-login"
               onclick="return openGoogleAuthPopup(event, 'login');"
               class="w-full flex items-center justify-center gap-3 px-4 py-2.5 rounded-xl bg-white border border-line hover:bg-cream hover:border-primary-300 text-ink text-sm font-semibold shadow-sm transition duration-150">
                <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Tiếp tục với Google</span>
            </a>
        </div>

        <!-- Phân cách -->
        <div class="relative my-5">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-line"></div>
            </div>
            <div class="relative flex justify-center text-xs">
                <span class="px-3 bg-surface text-ink-muted">hoặc đăng nhập bằng Email</span>
            </div>
        </div>

        <!-- Form Đăng nhập -->
        <form th:action="@{/login}" method="POST" class="space-y-4" x-data="{ showPassword: false }">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div>
                <label for="email" class="block text-xs font-semibold text-ink mb-1">Địa chỉ Email</label>
                <div class="relative">
                    <input type="email" id="email" name="email" required autofocus
                           th:value="${email != null ? email : (param.email != null ? param.email : '')}"
                           placeholder="vidu@email.com"
                           class="input-field pl-10 text-sm">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                </div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-xs font-semibold text-ink">Mật khẩu</label>
                </div>
                <div class="relative">
                    <input :type="showPassword ? 'text' : 'password'" id="password" name="password" required
                           placeholder="••••••••"
                           class="input-field pl-10 pr-10 text-sm">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <button type="button" @click="showPassword = !showPassword"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-ink-muted hover:text-ink transition"
                            title="Hiển thị mật khẩu">
                        <i x-show="!showPassword" data-lucide="eye" class="w-4 h-4"></i>
                        <i x-show="showPassword" data-lucide="eye-off" class="w-4 h-4" style="display: none;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary w-full py-2.5 text-sm font-semibold mt-2">
                Đăng nhập
            </button>
        </form>

        <!-- Chuyển sang Đăng ký -->
        <div class="mt-6 pt-4 border-t border-line text-center text-xs text-ink-muted">
            <span>Chưa có tài khoản trên VietSpecialty?</span>
            <a th:href="@{/register}" class="font-semibold text-primary-600 hover:text-primary-700 ml-1">
                Đăng ký ngay
            </a>
        </div>
    </div>
</div>

<th:block layout:fragment="extraJs">
<script>
    function openGoogleAuthPopup(event, mode) {
        var width = 480;
        var height = 660;
        var dualScreenLeft = window.screenLeft !== undefined ? window.screenLeft : window.screenX;
        var dualScreenTop = window.screenTop !== undefined ? window.screenTop : window.screenY;
        var outerWidth = window.outerWidth || document.documentElement.clientWidth || screen.width;
        var outerHeight = window.outerHeight || document.documentElement.clientHeight || screen.height;
        var left = Math.max(0, Math.round(dualScreenLeft + (outerWidth - width) / 2));
        var top = Math.max(0, Math.round(dualScreenTop + (outerHeight - height) / 2));

        var popupUrl = '/auth/google?mode=' + encodeURIComponent(mode || 'login') + '&popup=true';
        var features = 'width=' + width + ',height=' + height + ',left=' + left + ',top=' + top
            + ',menubar=no,toolbar=no,location=yes,status=no,resizable=yes,scrollbars=yes';
        var popupWin = window.open(popupUrl, 'VietSpecialtyGoogleAuth', features);

        if (!popupWin) {
            return true;
        }

        if (event) {
            event.preventDefault();
        }
        try {
            popupWin.focus();
        } catch (e) {}
        return false;
    }

    window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) {
            return;
        }
        var data = event.data;
        if (!data || data.type !== 'GOOGLE_AUTH_COMPLETE') {
            return;
        }
        if (data.success) {
            window.location.href = data.redirectUrl || '/';
        } else {
            window.location.href = data.errorUrl || ('/login?error=' + encodeURIComponent(data.message || 'Xác thực Google thất bại'));
        }
    });
</script>
</th:block>
</body>
</html>
