<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoàn tất xác thực Google — VietSpecialty</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #202124;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .box {
            max-width: 360px;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #e8eaed;
            border-top-color: #1a73e8;
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.75s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 6px;
        }

        p {
            font-size: 13px;
            color: #5f6368;
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner" aria-hidden="true"></div>
        <h1 th:text="${success ? 'Xác thực thành công' : 'Xác thực không thành công'}">Đang hoàn tất xác thực...</h1>
        <p th:text="${message != null && !message.isEmpty() ? message : 'Đang quay lại VietSpecialty...'}">Đang quay lại VietSpecialty...</p>
    </div>

    <script th:inline="javascript">
        (function () {
            var payload = {
                type: 'GOOGLE_AUTH_COMPLETE',
                success: /*[[${success}]]*/ false,
                redirectUrl: /*[[${redirectUrl}]]*/ '/',
                errorUrl: /*[[${errorUrl}]]*/ '/login',
                message: /*[[${message}]]*/ ''
            };

            var targetUrl = payload.success
                ? (payload.redirectUrl || '/')
                : (payload.errorUrl || '/login');

            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage(payload, window.location.origin);
                } catch (e) {
                    // Fallback below if postMessage fails
                }
                window.close();
                setTimeout(function () {
                    window.location.href = targetUrl;
                }, 800);
            } else {
                window.location.href = targetUrl;
            }
        })();
    </script>
</body>
</html>
