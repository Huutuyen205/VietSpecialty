<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Đăng ký tài khoản — VietSpecialty</title>
</head>
<body>
<div layout:fragment="content" class="py-10 max-w-md mx-auto">
    <div class="card p-8 bg-surface shadow-lift">
        <!-- Header form -->
        <div class="text-center mb-6">
            <h1 class="font-serif text-2xl font-bold text-ink">Đăng ký tài khoản</h1>
            <p class="text-xs text-ink-muted mt-1">Trở thành thành viên để nhận ưu đãi và mua đặc sản dễ dàng</p>
        </div>

        <!-- Form Đăng ký -->
        <form th:action="@{/register}" th:object="${registerRequest}" method="POST" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Họ và tên -->
            <div>
                <label for="fullName" class="block text-xs font-semibold text-ink mb-1">Họ và tên</label>
                <div class="relative">
                    <input type="text" id="fullName" th:field="*{fullName}"
                           placeholder="Nguyễn Văn A"
                           class="input-field pl-10 text-sm"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'input-error' : ''">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                </div>
                <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-xs text-danger mt-1"></p>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-xs font-semibold text-ink mb-1">Địa chỉ Email</label>
                <div class="relative">
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="vidu@email.com"
                           class="input-field pl-10 text-sm"
                           th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="mail" class="w-4 h-4"></i>
                    </span>
                </div>
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-xs text-danger mt-1"></p>
            </div>

            <!-- Số điện thoại -->
            <div>
                <label for="phone" class="block text-xs font-semibold text-ink mb-1">Số điện thoại</label>
                <div class="relative">
                    <input type="tel" id="phone" th:field="*{phone}"
                           placeholder="0912345678"
                           class="input-field pl-10 text-sm"
                           th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="phone" class="w-4 h-4"></i>
                    </span>
                </div>
                <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-danger mt-1"></p>
            </div>

            <!-- Mật khẩu -->
            <div>
                <label for="password" class="block text-xs font-semibold text-ink mb-1">Mật khẩu (tối thiểu 8 ký tự)</label>
                <div class="relative">
                    <input type="password" id="password" th:field="*{password}"
                           placeholder="••••••••"
                           class="input-field pl-10 text-sm"
                           th:classappend="${#fields.hasErrors('password')} ? 'input-error' : ''">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                </div>
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-xs text-danger mt-1"></p>
            </div>

            <!-- Nhập lại mật khẩu -->
            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-ink mb-1">Nhập lại mật khẩu</label>
                <div class="relative">
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                           placeholder="••••••••"
                           class="input-field pl-10 text-sm"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error' : ''">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-ink-muted">
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </span>
                </div>
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-xs text-danger mt-1"></p>
            </div>

            <button type="submit" class="btn-primary w-full py-2.5 text-sm font-semibold mt-2">
                Tạo tài khoản
            </button>
        </form>

        <!-- Chuyển sang Đăng nhập -->
        <div class="mt-6 pt-4 border-t border-line text-center text-xs text-ink-muted">
            <span>Đã có tài khoản?</span>
            <a th:href="@{/login}" class="font-semibold text-primary-600 hover:text-primary-700 ml-1">
                Đăng nhập ngay
            </a>
        </div>
    </div>
</div>
</body>
</html>
