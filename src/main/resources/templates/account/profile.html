<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Hồ sơ cá nhân — VietSpecialty</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <!-- Breadcrumb -->
    <div th:replace="~{fragments/ui-components :: breadcrumbs(${ { {title:'Tài khoản', url:'/account/profile'}, {title:'Hồ sơ cá nhân'} } })}"></div>

    <div class="flex flex-col md:flex-row gap-6 mt-4">
        <!-- Sidebar -->
        <div th:replace="~{account/account-sidebar :: accountSidebar('profile')}"></div>

        <!-- Form Hồ sơ -->
        <div class="flex-1">
            <div class="card p-6 bg-surface">
                <div class="border-b border-line pb-4 mb-6">
                    <h2 class="font-serif text-xl font-bold text-ink">Hồ sơ cá nhân</h2>
                    <p class="text-xs text-ink-muted mt-1">Quản lý thông tin hồ sơ để bảo mật tài khoản</p>
                </div>

                <!-- Flash Message -->
                <div th:if="${successMessage}" class="mb-4 p-3 rounded-xl bg-primary-50 border border-primary-200 text-xs text-primary-700 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-primary-600"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-danger flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-danger"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/account/profile}" th:object="${profileRequest}" method="POST" class="max-w-lg space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Email (Read only) -->
                    <div>
                        <label class="block text-xs font-semibold text-ink mb-1">Địa chỉ Email</label>
                        <input type="email" th:value="${user.email}" disabled
                               class="input-field bg-surface-muted cursor-not-allowed text-ink-muted text-sm">
                        <span class="text-[11px] text-ink-muted mt-1 block">Email dùng để đăng nhập và không thể thay đổi</span>
                    </div>

                    <!-- Họ và tên -->
                    <div>
                        <label for="fullName" class="block text-xs font-semibold text-ink mb-1">Họ và tên</label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               class="input-field text-sm"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'input-error' : ''">
                        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-xs text-danger mt-1"></p>
                    </div>

                    <!-- Số điện thoại -->
                    <div>
                        <label for="phone" class="block text-xs font-semibold text-ink mb-1">Số điện thoại <span class="font-normal text-ink-muted">(không bắt buộc)</span></label>
                        <input type="tel" id="phone" th:field="*{phone}"
                               placeholder="VD: 0912345678"
                               class="input-field text-sm"
                               th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''">
                        <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-xs text-danger mt-1"></p>
                    </div>

                    <!-- Vai trò -->
                    <div>
                        <label class="block text-xs font-semibold text-ink mb-1">Vai trò tài khoản</label>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-primary-50 text-primary-700 border border-primary-200"
                              th:text="${user.role.name()}">
                            USER
                        </span>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="btn-primary px-6 py-2.5 text-xs font-semibold">
                            Lưu thay đổi
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
