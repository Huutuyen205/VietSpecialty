<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: html(
        pageTitle='Đăng ký mở gian hàng đặc sản - VietSpecialty',
        content=~{::#mainContent},
        pageMeta=~{},
        extraCss=~{},
        extraJs=~{}
      )}">

<div id="mainContent" class="space-y-6">

    <!-- BREADCRUMB -->
    <nav class="flex text-xs text-ink-muted" aria-label="Breadcrumb">
        <ol class="inline-flex items-center space-x-1 md:space-x-2">
            <li><a th:href="@{/}" class="hover:text-primary-600 flex items-center gap-1"><i data-lucide="home" class="w-3.5 h-3.5"></i> Trang chủ</a></li>
            <li><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-ink-muted"></i></li>
            <li><a th:href="@{/account/profile}" class="hover:text-primary-600">Tài khoản</a></li>
            <li><i data-lucide="chevron-right" class="w-3.5 h-3.5 text-ink-muted"></i></li>
            <li><span class="text-ink font-medium">Đăng ký gian hàng</span></li>
        </ol>
    </nav>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 items-start">
        
        <!-- SIDEBAR TÀI KHOẢN -->
        <div class="md:col-span-1" th:replace="~{account/account-sidebar :: accountSidebar(active='shop-reg')}"></div>

        <!-- CỘT CHÍNH: FORM ĐĂNG KÝ -->
        <main class="md:col-span-3 bg-surface rounded-2xl p-6 sm:p-8 border border-line shadow-sm space-y-6">
            
            <div class="border-b border-line pb-4 space-y-1">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-primary-100 text-primary-700 flex items-center justify-center font-bold">
                        <i data-lucide="store" class="w-5 h-5"></i>
                    </div>
                    <h1 class="text-lg font-bold text-ink">Đăng ký trở thành Người bán / HTX Đặc sản</h1>
                </div>
                <p class="text-xs text-ink-muted">
                    Tham gia mạng lưới kết nối nông sản & đặc sản truyền thống ba miền, đưa tinh hoa quê hương vươn xa toàn quốc.
                </p>
            </div>

            <!-- Thông báo lỗi nếu có -->
            <div th:if="${errorMessage != null}" class="alert alert-error">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span th:text="${errorMessage}">Có lỗi xảy ra</span>
            </div>

            <form th:action="@{/account/shop-registration}" method="POST" enctype="multipart/form-data" class="space-y-5"
                  th:object="${shopRequest}">
                
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- 1. Tên gian hàng -->
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Tên gian hàng / HTX / Cơ sở sản xuất <span class="text-danger">*</span>
                    </label>
                    <input type="text" th:field="*{name}" required
                           placeholder="Ví dụ: HTX Nông Sản Sạch Tân Cương, Cơ sở Bánh Đậu Xanh Nguyên Hương..."
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <!-- 2. Tỉnh / Thành phố & Hotline -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-ink mb-1">
                            Tỉnh / Thành phố cơ sở <span class="text-danger">*</span>
                        </label>
                        <select th:field="*{provinceId}" required
                                class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                            <option value="">-- Chọn tỉnh thành đặt gian hàng --</option>
                            <option th:each="p : ${provinces}" th:value="${p.id}" th:text="${p.name}">Thái Nguyên</option>
                        </select>
                        <p th:if="${#fields.hasErrors('provinceId')}" th:errors="*{provinceId}" class="text-[11px] text-danger mt-1"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-ink mb-1">
                            Số điện thoại Hotline gian hàng <span class="text-danger">*</span>
                        </label>
                        <input type="tel" th:field="*{hotline}" required placeholder="0912345678"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                        <p th:if="${#fields.hasErrors('hotline')}" th:errors="*{hotline}" class="text-[11px] text-danger mt-1"></p>
                    </div>
                </div>

                <!-- 3. Địa chỉ kho / lấy hàng -->
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Địa chỉ chi tiết cơ sở / kho lấy hàng <span class="text-danger">*</span>
                    </label>
                    <input type="text" th:field="*{pickupAddress}" required
                           placeholder="Ví dụ: Xã Tân Cương, TP. Thái Nguyên, Tỉnh Thái Nguyên"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                    <p th:if="${#fields.hasErrors('pickupAddress')}" th:errors="*{pickupAddress}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <!-- 4. Mô tả gian hàng & câu chuyện sản phẩm -->
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Giới thiệu cơ sở & câu chuyện truyền thống (tùy chọn)
                    </label>
                    <textarea th:field="*{description}" rows="3"
                              placeholder="Chia sẻ về lịch sử làng nghề, quy trình chế biến, tiêu chuẩn an toàn thực phẩm..."
                              class="w-full px-3.5 py-2 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none"></textarea>
                </div>

                <!-- 5. Logo / Ảnh đại diện gian hàng -->
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Ảnh đại diện / Logo gian hàng (tùy chọn, tối đa 5MB)
                    </label>
                    <input type="file" name="logo" accept="image/png, image/jpeg, image/webp"
                           class="w-full text-xs text-ink-muted file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100 cursor-pointer">
                </div>

                <!-- 6. Cam kết quy chế sàn -->
                <div class="p-4 rounded-xl bg-surface-muted/40 border border-line space-y-2">
                    <label class="flex items-start gap-2.5 cursor-pointer">
                        <input type="checkbox" required class="mt-0.5 rounded text-primary-600 focus:ring-primary-500">
                        <span class="text-xs text-ink leading-relaxed">
                            Tôi cam kết mọi thông tin trên là chính xác, sản phẩm cung cấp đạt chuẩn vệ sinh an toàn thực phẩm, có nguồn gốc xuất xứ rõ ràng và tuân thủ quy chế hoạt động của sàn TMĐT VietSpecialty.
                        </span>
                    </label>
                </div>

                <!-- Nút gửi hồ sơ -->
                <div class="pt-2 flex items-center justify-end gap-3">
                    <a th:href="@{/account/profile}" class="btn btn-ghost py-2.5 px-5 text-xs">Hủy</a>
                    <button type="submit" class="btn btn-primary py-2.5 px-6 text-xs flex items-center gap-1.5 font-semibold">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Nộp hồ sơ xét duyệt</span>
                    </button>
                </div>

            </form>

        </main>
    </div>

</div>
</html>
