<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Sổ địa chỉ nhận hàng — VietSpecialty</title>
</head>
<body>
<div layout:fragment="content" class="py-4" x-data="{ showAddModal: false }">
    <!-- Breadcrumb -->
    <div th:replace="~{fragments/ui-components :: breadcrumbs(${ { {title:'Tài khoản', url:'/account/profile'}, {title:'Sổ địa chỉ nhận hàng'} } })}"></div>

    <div class="flex flex-col md:flex-row gap-6 mt-4">
        <!-- Sidebar -->
        <div th:replace="~{account/account-sidebar :: accountSidebar('addresses')}"></div>

        <!-- Nội dung Sổ địa chỉ -->
        <div class="flex-1 space-y-6">
            <div class="card p-6 bg-surface">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-6 border-b border-line gap-4">
                    <div>
                        <h2 class="font-serif text-xl font-bold text-ink">Địa chỉ nhận hàng</h2>
                        <p class="text-xs text-ink-muted mt-1">Lưu tối đa 10 địa chỉ để giao hàng nhanh chóng</p>
                    </div>
                    <button @click="showAddModal = true" class="btn-primary px-4 py-2 text-xs font-semibold flex items-center gap-1.5 self-start sm:self-auto">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>Thêm địa chỉ mới</span>
                    </button>
                </div>

                <!-- Flash Message -->
                <div th:if="${successMessage}" class="mb-4 p-3 rounded-xl bg-primary-50 border border-primary-200 text-xs text-primary-700 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-primary-600"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-danger flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-danger"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <!-- Danh sách địa chỉ -->
                <div th:if="${#lists.isEmpty(addresses)}" class="py-12 text-center">
                    <div class="w-16 h-16 rounded-full bg-surface-muted flex items-center justify-center mx-auto text-ink-muted mb-3">
                        <i data-lucide="map-pin-off" class="w-8 h-8"></i>
                    </div>
                    <p class="text-sm font-semibold text-ink">Chưa có địa chỉ nào</p>
                    <p class="text-xs text-ink-muted mt-1">Hãy thêm địa chỉ nhận hàng đầu tiên của bạn</p>
                </div>

                <div th:unless="${#lists.isEmpty(addresses)}" class="space-y-4">
                    <div th:each="addr : ${addresses}" class="p-4 rounded-xl border border-line flex flex-col sm:flex-row justify-between items-start gap-4 transition"
                         th:classappend="${addr.isDefault} ? 'bg-primary-50/30 border-primary-300' : 'bg-surface'">

                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm text-ink" th:text="${addr.receiverName}">Nguyễn Văn A</span>
                                <span class="text-xs text-ink-muted" th:text="'(' + ${addr.receiverPhone} + ')'">(0912345678)</span>
                                <span th:if="${addr.isDefault}" class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-primary-600 text-white">
                                    Mặc định
                                </span>
                            </div>
                            <p class="text-xs text-ink-muted leading-relaxed" th:text="${addr.fullAddress}">
                                Số 123 đường Giải Phóng, Phường Đồng Tâm, Hà Nội
                            </p>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <!-- Nút thiết lập mặc định -->
                            <form th:if="${!addr.isDefault}" th:action="@{'/account/addresses/' + ${addr.id} + '/default'}" method="POST">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="text-xs text-primary-600 hover:text-primary-700 font-semibold p-1.5 hover:bg-surface-muted rounded-lg transition">
                                    Thiết lập mặc định
                                </button>
                            </form>

                            <!-- Nút xóa -->
                            <form th:action="@{'/account/addresses/' + ${addr.id} + '/delete'}" method="POST"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa địa chỉ này?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="text-xs text-danger hover:text-red-700 font-semibold p-1.5 hover:bg-red-50 rounded-lg transition">
                                    Xóa
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Thêm địa chỉ mới -->
    <div x-show="showAddModal" x-transition
         class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/40 backdrop-blur-sm"
         style="display: none;">
        <div class="card p-6 bg-surface max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl" @click.outside="showAddModal = false">
            <div class="flex items-center justify-between pb-3 mb-4 border-b border-line">
                <h3 class="font-serif text-lg font-bold text-ink">Thêm địa chỉ nhận hàng</h3>
                <button @click="showAddModal = false" class="text-ink-muted hover:text-ink p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form th:action="@{/account/addresses}" th:object="${addressRequest}" method="POST" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="receiverName" class="block text-xs font-semibold text-ink mb-1">Họ tên người nhận</label>
                        <input type="text" id="receiverName" th:field="*{receiverName}" required placeholder="Họ và tên" class="input-field text-xs">
                    </div>
                    <div>
                        <label for="receiverPhone" class="block text-xs font-semibold text-ink mb-1">Số điện thoại</label>
                        <input type="tel" id="receiverPhone" th:field="*{receiverPhone}" required placeholder="09xxxxxxxx" class="input-field text-xs">
                    </div>
                </div>

                <div>
                    <label for="provinceId" class="block text-xs font-semibold text-ink mb-1">Tỉnh / Thành phố (34 tỉnh 2025)</label>
                    <select id="provinceId" th:field="*{provinceId}" required class="input-field text-xs">
                        <option value="" disabled selected>-- Chọn Tỉnh / Thành phố --</option>
                        <option th:each="p : ${provinces}" th:value="${p.id}" th:text="${p.name}">Hà Nội</option>
                    </select>
                </div>

                <div>
                    <label for="ward" class="block text-xs font-semibold text-ink mb-1">Phường / Xã</label>
                    <input type="text" id="ward" th:field="*{ward}" required placeholder="Ví dụ: Phường Đồng Tâm" class="input-field text-xs">
                </div>

                <div>
                    <label for="streetAddress" class="block text-xs font-semibold text-ink mb-1">Địa chỉ chi tiết (số nhà, tên đường, thôn/xóm)</label>
                    <input type="text" id="streetAddress" th:field="*{streetAddress}" required placeholder="Ví dụ: Số 25 ngõ 10 đường Giải Phóng" class="input-field text-xs">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="isDefault" th:field="*{isDefault}" class="rounded text-primary-600 focus:ring-primary-500">
                    <label for="isDefault" class="text-xs text-ink select-none cursor-pointer">Đặt làm địa chỉ nhận hàng mặc định</label>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-line">
                    <button type="button" @click="showAddModal = false" class="btn-outline px-4 py-2 text-xs">Hủy bỏ</button>
                    <button type="submit" class="btn-primary px-5 py-2 text-xs font-semibold">Lưu địa chỉ</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
