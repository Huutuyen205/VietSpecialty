<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"></head>
<body>
<aside th:fragment="accountSidebar(activeTab)" class="w-full md:w-64 flex-shrink-0">
    <div class="card p-4 bg-surface">
        <div class="flex items-center gap-3 pb-4 mb-4 border-b border-line">
            <div class="w-12 h-12 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-bold text-base uppercase border border-primary-200">
                <span sec:authentication="name" th:text="${#strings.substring(#authentication.name,0,1)}">U</span>
            </div>
            <div class="overflow-hidden">
                <h3 class="text-sm font-bold text-ink truncate" sec:authentication="name">User</h3>
                <span class="inline-block text-[11px] text-ink-muted">Tài khoản thành viên</span>
            </div>
        </div>

        <nav class="space-y-1 text-xs font-medium">
            <a th:href="@{/account/profile}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition"
               th:classappend="${activeTab == 'profile'} ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-ink hover:bg-surface-muted'">
                <i data-lucide="user" class="w-4 h-4"></i>
                <span>Hồ sơ cá nhân</span>
            </a>

            <a th:href="@{/account/addresses}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition"
               th:classappend="${activeTab == 'addresses'} ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-ink hover:bg-surface-muted'">
                <i data-lucide="map-pin" class="w-4 h-4"></i>
                <span>Sổ địa chỉ nhận hàng</span>
            </a>

            <a th:href="@{/orders}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition"
               th:classappend="${activeTab == 'orders'} ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-ink hover:bg-surface-muted'">
                <i data-lucide="package" class="w-4 h-4"></i>
                <span>Đơn mua của tôi</span>
            </a>

            <a th:href="@{/wishlist}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition"
               th:classappend="${activeTab == 'wishlist'} ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-ink hover:bg-surface-muted'">
                <i data-lucide="heart" class="w-4 h-4"></i>
                <span>Đặc sản yêu thích</span>
            </a>

            <a th:href="@{/account/password}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition"
               th:classappend="${activeTab == 'password'} ? 'bg-primary-50 text-primary-700 font-semibold' : 'text-ink hover:bg-surface-muted'">
                <i data-lucide="key-round" class="w-4 h-4"></i>
                <span>Đổi mật khẩu</span>
            </a>

            <div class="pt-2 border-t border-line my-2"></div>

            <a sec:authorize="hasRole('SELLER')" th:href="@{/seller/dashboard}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-primary-700 bg-primary-50 hover:bg-primary-100 transition font-semibold">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Kênh người bán</span>
            </a>

            <a sec:authorize="hasRole('USER') and !hasRole('SELLER')" th:href="@{/account/shop-registration}"
               class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl transition font-semibold"
               th:classappend="${activeTab == 'shop-reg'} ? 'bg-secondary-100 text-secondary-600' : 'text-secondary-500 hover:bg-secondary-100/60'">
                <i data-lucide="store" class="w-4 h-4"></i>
                <span>Đăng ký mở gian hàng</span>
            </a>
        </nav>
    </div>
</aside>
</body>
</html>
