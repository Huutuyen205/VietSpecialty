<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>Đổi mật khẩu — VietSpecialty</title>
</head>
<body>
<div layout:fragment="content" class="py-4">
    <!-- Breadcrumb -->
    <div th:replace="~{fragments/ui-components :: breadcrumbs(${ { {title:'Tài khoản', url:'/account/profile'}, {title:'Đổi mật khẩu'} } })}"></div>

    <div class="flex flex-col md:flex-row gap-6 mt-4">
        <!-- Sidebar -->
        <div th:replace="~{account/account-sidebar :: accountSidebar('password')}"></div>

        <!-- Form Đổi mật khẩu -->
        <div class="flex-1">
            <div class="card p-6 bg-surface">
                <div class="border-b border-line pb-4 mb-6">
                    <h2 class="font-serif text-xl font-bold text-ink">Đổi mật khẩu</h2>
                    <p class="text-xs text-ink-muted mt-1">Để bảo mật tài khoản, vui lòng không chia sẻ mật khẩu cho người khác</p>
                </div>

                <!-- Flash Message -->
                <div th:if="${successMessage}" class="mb-4 p-3 rounded-xl bg-primary-50 border border-primary-200 text-xs text-primary-700 flex items-center gap-2">
                    <i data-lucide="check-circle" class="w-4 h-4 text-primary-600"></i>
                    <span th:text="${successMessage}"></span>
                </div>
                <div th:if="${errorMessage}" class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-danger flex items-center gap-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-danger"></i>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/account/password}" th:object="${passwordRequest}" method="POST" class="max-w-lg space-y-4">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Mật khẩu hiện tại -->
                    <div>
                        <label for="oldPassword" class="block text-xs font-semibold text-ink mb-1">Mật khẩu hiện tại</label>
                        <input type="password" id="oldPassword" th:field="*{oldPassword}"
                               placeholder="••••••••"
                               class="input-field text-sm"
                               th:classappend="${#fields.hasErrors('oldPassword')} ? 'input-error' : ''">
                        <p th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}" class="text-xs text-danger mt-1"></p>
                    </div>

                    <!-- Mật khẩu mới -->
                    <div>
                        <label for="newPassword" class="block text-xs font-semibold text-ink mb-1">Mật khẩu mới (tối thiểu 8 ký tự)</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}"
                               placeholder="••••••••"
                               class="input-field text-sm"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'input-error' : ''">
                        <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-xs text-danger mt-1"></p>
                    </div>

                    <!-- Xác nhận mật khẩu mới -->
                    <div>
                        <label for="confirmNewPassword" class="block text-xs font-semibold text-ink mb-1">Nhập lại mật khẩu mới</label>
                        <input type="password" id="confirmNewPassword" th:field="*{confirmNewPassword}"
                               placeholder="••••••••"
                               class="input-field text-sm"
                               th:classappend="${#fields.hasErrors('confirmNewPassword')} ? 'input-error' : ''">
                        <p th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}" class="text-xs text-danger mt-1"></p>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="btn-primary px-6 py-2.5 text-xs font-semibold">
                            Cập nhật mật khẩu
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
