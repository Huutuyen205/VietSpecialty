<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">
<head>
    <title>500 — Đã có lỗi xảy ra</title>
</head>
<body>
<div layout:fragment="content" class="py-16 text-center max-w-lg mx-auto">
    <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6 text-danger border border-red-200 shadow-soft">
        <i data-lucide="alert-triangle" class="w-10 h-10"></i>
    </div>
    <h1 class="font-serif text-3xl font-bold text-ink mb-3">Đã xảy ra sự cố</h1>
    <p class="text-sm text-ink-muted leading-relaxed mb-8" th:text="${errorMessage != null ? errorMessage : 'Hệ thống gặp sự cố trong quá trình xử lý yêu cầu. Kỹ thuật viên đã nhận được thông báo.'}">
        Hệ thống gặp sự cố trong quá trình xử lý yêu cầu. Kỹ thuật viên đã nhận được thông báo.
    </p>
    <div class="flex items-center justify-center gap-3">
        <a th:href="@{/}" class="btn-primary px-6 py-2.5 text-sm">Về trang chủ</a>
        <button onclick="window.location.reload()" class="btn-outline px-6 py-2.5 text-sm">Tải lại trang</button>
    </div>
</div>
</body>
</html>
