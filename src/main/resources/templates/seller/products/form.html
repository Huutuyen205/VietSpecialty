<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/seller-base :: html(
        pageTitle=(${isEdit} ? 'Chỉnh sửa đặc sản' : 'Thêm đặc sản mới') + ' - VietSpecialty',
        content=~{::#sellerProductFormContent},
        extraCss=~{},
        extraJs=~{}
      )}">

<div id="sellerProductFormContent" class="space-y-6">

    <!-- Header Form -->
    <div class="bg-surface rounded-2xl p-6 border border-line shadow-sm flex items-center justify-between">
        <div>
            <h1 class="text-lg font-bold text-ink" th:text="${isEdit} ? 'Chỉnh sửa thông tin đặc sản' : 'Đăng bán đặc sản mới'">Đăng bán đặc sản mới</h1>
            <p class="text-xs text-ink-muted mt-0.5">Cung cấp thông tin chi tiết, xuất xứ rõ ràng để khách hàng an tâm mua sắm</p>
        </div>
        <a th:href="@{/seller/products}" class="btn btn-outline py-2 px-3 text-xs flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Quay lại danh sách</span>
        </a>
    </div>

    <!-- Thông báo lỗi nếu có -->
    <div th:if="${errorMessage != null}" class="alert alert-error">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span th:text="${errorMessage}">Có lỗi xảy ra</span>
    </div>

    <!-- Form chính -->
    <form th:action="${isEdit} ? @{'/seller/products/' + ${product.id} + '/edit'} : @{/seller/products/create}"
          method="POST" enctype="multipart/form-data" class="space-y-6"
          th:object="${productRequest}">

        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- KHỐI 1: THÔNG TIN CƠ BẢN -->
        <div class="bg-surface rounded-2xl p-6 border border-line shadow-sm space-y-4">
            <h3 class="font-bold text-sm text-ink flex items-center gap-2 pb-2 border-b border-line">
                <i data-lucide="info" class="w-4 h-4 text-primary-600"></i> Thông tin cơ bản
            </h3>

            <!-- Tên sản phẩm -->
            <div>
                <label class="block text-xs font-semibold text-ink mb-1">
                    Tên đặc sản vùng miền <span class="text-danger">*</span>
                </label>
                <input type="text" th:field="*{name}" required
                       placeholder="Ví dụ: Chè Tân Cương Thái Nguyên Hộp 500g, Nước mắm Phú Quốc truyền thống 40 độ đạm..."
                       class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-[11px] text-danger mt-1"></p>
            </div>

            <!-- Danh mục & Tỉnh thành & Hạng OCOP -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Danh mục sản phẩm <span class="text-danger">*</span>
                    </label>
                    <select th:field="*{categoryId}" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Trà & Cà phê</option>
                    </select>
                    <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Tỉnh / Thành xuất xứ <span class="text-danger">*</span>
                    </label>
                    <select th:field="*{provinceId}" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                        <option value="">-- Chọn tỉnh thành --</option>
                        <option th:each="p : ${provinces}" th:value="${p.id}" th:text="${p.name}">Thái Nguyên</option>
                    </select>
                    <p th:if="${#fields.hasErrors('provinceId')}" th:errors="*{provinceId}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Hạng OCOP (nếu có)
                    </label>
                    <select th:field="*{ocopRating}"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                        <option value="">Không có chứng nhận OCOP</option>
                        <option value="3">3★ OCOP Cấp Tỉnh</option>
                        <option value="4">4★ OCOP Tiêu Biểu</option>
                        <option value="5">5★ OCOP Quốc Gia</option>
                    </select>
                </div>
            </div>

            <!-- Xuất xứ chi tiết -->
            <div>
                <label class="block text-xs font-semibold text-ink mb-1">
                    Xuất xứ chi tiết (Làng nghề / Xã / Huyện) <span class="text-danger">*</span>
                </label>
                <input type="text" th:field="*{originDetail}" required
                       placeholder="Ví dụ: Xã Tân Cương, Huyện Đồng Hỷ, Thái Nguyên"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                <p th:if="${#fields.hasErrors('originDetail')}" th:errors="*{originDetail}" class="text-[11px] text-danger mt-1"></p>
            </div>

            <!-- Mô tả ngắn -->
            <div>
                <label class="block text-xs font-semibold text-ink mb-1">Mô tả ngắn gọn (tối đa 500 ký tự)</label>
                <textarea th:field="*{shortDescription}" rows="2"
                          placeholder="Tóm tắt điểm đặc sắc nhất của sản phẩm..."
                          class="w-full px-3.5 py-2 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none"></textarea>
            </div>

            <!-- Mô tả chi tiết -->
            <div>
                <label class="block text-xs font-semibold text-ink mb-1">
                    Mô tả chi tiết & Câu chuyện đặc sản <span class="text-danger">*</span>
                </label>
                <textarea th:field="*{description}" rows="6" required
                          placeholder="Chia sẻ quy trình sản xuất, công thức gia truyền, hương vị đặc trưng..."
                          class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none"></textarea>
                <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-[11px] text-danger mt-1"></p>
            </div>
        </div>

        <!-- KHỐI 2: GIÁ BÁN & QUY CÁCH ĐÓNG GÓI -->
        <div class="bg-surface rounded-2xl p-6 border border-line shadow-sm space-y-4">
            <h3 class="font-bold text-sm text-ink flex items-center gap-2 pb-2 border-b border-line">
                <i data-lucide="dollar-sign" class="w-4 h-4 text-primary-600"></i> Giá bán & Quy cách
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Giá bán (VNĐ) <span class="text-danger">*</span>
                    </label>
                    <input type="number" th:field="*{price}" required min="1000" step="500" placeholder="185000"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                    <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Số lượng tồn kho <span class="text-danger">*</span>
                    </label>
                    <input type="number" th:field="*{stock}" required min="0" placeholder="50"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                    <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Đơn vị tính <span class="text-danger">*</span>
                    </label>
                    <input type="text" th:field="*{unit}" required placeholder="Hộp 500g, Chai 500ml..."
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                    <p th:if="${#fields.hasErrors('unit')}" th:errors="*{unit}" class="text-[11px] text-danger mt-1"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">
                        Khối lượng tịnh (Gram)
                    </label>
                    <input type="number" th:field="*{weightGram}" min="1" placeholder="500"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">Hạn sử dụng</label>
                    <input type="text" th:field="*{shelfLife}" placeholder="Ví dụ: 12 tháng kể từ ngày sản xuất"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-ink mb-1">Hướng dẫn bảo quản</label>
                    <input type="text" th:field="*{storageInstructions}" placeholder="Ví dụ: Nơi khô ráo, tránh ánh sáng trực tiếp"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-line text-xs focus:ring-2 focus:ring-primary-500/20 focus:border-primary-600 focus:outline-none">
                </div>
            </div>
        </div>

        <!-- KHỐI 3: HÌNH ẢNH SẢN PHẨM -->
        <div class="bg-surface rounded-2xl p-6 border border-line shadow-sm space-y-4">
            <h3 class="font-bold text-sm text-ink flex items-center gap-2 pb-2 border-b border-line">
                <i data-lucide="image" class="w-4 h-4 text-primary-600"></i> Hình ảnh đặc sản
            </h3>

            <!-- Ảnh hiện có (nếu là chỉnh sửa) -->
            <div th:if="${isEdit and product.images != null and !product.images.isEmpty()}" class="space-y-2">
                <span class="text-xs text-ink-muted">Ảnh hiện tại:</span>
                <div class="flex items-center gap-3 overflow-x-auto pb-2">
                    <div th:each="img : ${product.images}" class="relative w-20 h-20 rounded-xl overflow-hidden border border-line bg-surface-muted flex-shrink-0">
                        <img th:src="${img.imageUrl}" alt="" class="w-full h-full object-cover">
                        <span th:if="${img.isPrimary}" class="absolute bottom-0 inset-x-0 bg-primary-700/80 text-white text-[9px] text-center py-0.5 font-bold">Ảnh chính</span>
                    </div>
                </div>
            </div>

            <!-- Upload ảnh mới -->
            <div>
                <label class="block text-xs font-semibold text-ink mb-1">
                    <span th:text="${isEdit} ? 'Tải thêm ảnh mới (tùy chọn)' : 'Tải lên hình ảnh sản phẩm (chọn tối thiểu 1 ảnh) *'">Tải lên ảnh</span>
                </label>
                <input type="file" th:name="${isEdit} ? 'newImages' : 'images'" multiple accept="image/png, image/jpeg, image/webp"
                       th:required="${!isEdit}"
                       class="w-full text-xs text-ink-muted file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100 cursor-pointer border border-dashed border-line rounded-xl p-4">
                <p class="text-[11px] text-ink-muted mt-1.5">Hỗ trợ định dạng JPG, PNG, WEBP. Ảnh đầu tiên sẽ được chọn làm ảnh đại diện chính.</p>
            </div>
        </div>

        <!-- Nút Submit -->
        <div class="flex items-center justify-end gap-3 pt-2">
            <a th:href="@{/seller/products}" class="btn btn-ghost py-2.5 px-5 text-xs">Hủy</a>
            <button type="submit" class="btn btn-primary py-2.5 px-6 text-xs flex items-center gap-1.5 font-semibold">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span th:text="${isEdit} ? 'Cập nhật sản phẩm' : 'Đăng bán sản phẩm'">Lưu sản phẩm</span>
            </button>
        </div>

    </form>

</div>
</html>
