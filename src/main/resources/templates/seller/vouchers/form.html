<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/seller-base :: html(
        pageTitle='Tạo Mã Giảm Giá Gian Hàng - VietSpecialty',
        content=~{::#sellerVoucherFormContent},
        extraCss=~{},
        extraJs=~{}
      )}">

<div id="sellerVoucherFormContent" class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-stone-900">Tạo Mã Giảm Giá Mới</h1>
            <p class="text-xs text-stone-500">Mã voucher sẽ áp dụng riêng cho các sản phẩm của gian hàng <strong th:text="${shop.name}"></strong></p>
        </div>
        <a th:href="@{/seller/vouchers}" class="px-3.5 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-700 hover:bg-stone-50 transition">
            Quay lại
        </a>
    </div>

    <!-- Thông báo lỗi nếu có -->
    <div th:if="${errorMessage}" class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs">
        <form th:action="@{/seller/vouchers}" method="post" class="space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Mã Voucher (viết hoa không dấu)</label>
                    <input type="text" name="code" required placeholder="VD: SHOP10, TRIAN50"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none uppercase font-mono font-bold">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Tên chương trình khuyến mại</label>
                    <input type="text" name="name" required placeholder="VD: Tri ân khách hàng tháng 11"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Loại giảm giá</label>
                    <select name="discountType" required class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                        <option value="PERCENT">Theo phần trăm (%)</option>
                        <option value="FIXED">Số tiền cố định (VNĐ)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Giá trị giảm</label>
                    <input type="number" name="discountValue" required min="1" step="any" placeholder="VD: 10 (%) hoặc 30000 (đ)"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none font-bold">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Giảm tối đa (khi chọn %)</label>
                    <input type="number" name="maxDiscount" min="0" placeholder="Để trống nếu không giới hạn"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Đơn hàng tối thiểu (VNĐ)</label>
                    <input type="number" name="minOrderValue" required min="0" value="0"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Tổng lượt dùng tối đa</label>
                    <input type="number" name="usageLimit" min="1" placeholder="VD: 100 (trống = vô hạn)"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Lượt dùng / Mỗi khách</label>
                    <input type="number" name="perUserLimit" required min="1" value="1"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Thời gian bắt đầu</label>
                    <input type="datetime-local" name="startAt" required
                           th:value="${#temporals.format(now, 'yyyy-MM-dd''T''HH:mm')}"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Thời gian kết thúc</label>
                    <input type="datetime-local" name="endAt" required
                           th:value="${#temporals.format(now.plusMonths(1), 'yyyy-MM-dd''T''HH:mm')}"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3 border-t border-stone-100">
                <a th:href="@{/seller/vouchers}" class="px-4 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-600 hover:bg-stone-50 transition">
                    Hủy
                </a>
                <button type="submit" class="px-5 py-2 bg-primary-700 hover:bg-primary-800 text-white font-bold rounded-xl text-xs transition shadow-xs">
                    Lưu & Phát Hành Voucher
                </button>
            </div>
        </form>
    </div>
</div>
</html>
