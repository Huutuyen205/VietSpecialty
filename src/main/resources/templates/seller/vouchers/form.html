<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/seller-base :: html(
        pageTitle='Tạo Mã Giảm Giá Gian Hàng - VietSpecialty',
        content=~{::#sellerVoucherFormContent},
        extraCss=~{},
        extraJs=~{}
      )}">

<div id="sellerVoucherFormContent" class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-stone-900">Tạo Mã Giảm Giá Mới</h1>
            <p class="text-xs text-stone-500">Mã voucher sẽ áp dụng riêng cho các sản phẩm của gian hàng <strong th:text="${shop.name}"></strong></p>
        </div>
        <a th:href="@{/seller/vouchers}" class="px-3.5 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-700 hover:bg-stone-50 transition">
            Quay lại
        </a>
    </div>

    <!-- Thông báo lỗi nếu có -->
    <div th:if="${errorMessage}" class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-xs">
        <form th:action="@{/seller/vouchers}" th:object="${voucherForm}" method="post" class="space-y-4">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${#fields.hasGlobalErrors()}" class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-medium space-y-1">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Mã Voucher (viết hoa không dấu)</label>
                    <input type="text" th:field="*{code}" required placeholder="VD: SHOP10, TRIAN50"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none uppercase font-mono font-bold"
                           th:classappend="${#fields.hasErrors('code')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('code')}" th:errors="*{code}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Tên chương trình khuyến mại</label>
                    <input type="text" th:field="*{name}" required placeholder="VD: Tri ân khách hàng tháng 11"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('name')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Loại giảm giá</label>
                    <select th:field="*{discountType}" required
                            class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                            th:classappend="${#fields.hasErrors('discountType')} ? 'border-rose-500 bg-rose-50/40' : ''">
                        <option value="PERCENT">Theo phần trăm (%)</option>
                        <option value="FIXED">Số tiền cố định (VNĐ)</option>
                    </select>
                    <p th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Giá trị giảm</label>
                    <input type="number" th:field="*{discountValue}" required min="1" step="any" placeholder="VD: 10 (%) hoặc 30000 (đ)"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none font-bold"
                           th:classappend="${#fields.hasErrors('discountValue')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Giảm tối đa (khi chọn %)</label>
                    <input type="number" th:field="*{maxDiscount}" min="0" placeholder="Để trống nếu không giới hạn"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('maxDiscount')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('maxDiscount')}" th:errors="*{maxDiscount}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Đơn hàng tối thiểu (VNĐ)</label>
                    <input type="number" th:field="*{minOrderValue}" required min="0"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('minOrderValue')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('minOrderValue')}" th:errors="*{minOrderValue}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Tổng lượt dùng tối đa</label>
                    <input type="number" th:field="*{usageLimit}" min="1" placeholder="VD: 100 (trống = vô hạn)"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('usageLimit')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('usageLimit')}" th:errors="*{usageLimit}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Lượt dùng / Mỗi khách</label>
                    <input type="number" th:field="*{perUserLimit}" required min="1"
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('perUserLimit')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('perUserLimit')}" th:errors="*{perUserLimit}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Thời gian bắt đầu</label>
                    <input type="datetime-local" th:field="*{startAt}" required
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('startAt')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('startAt')}" th:errors="*{startAt}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-stone-700 mb-1">Thời gian kết thúc</label>
                    <input type="datetime-local" th:field="*{endAt}" required
                           class="w-full px-3.5 py-2 text-xs border border-stone-300 rounded-xl focus:border-primary-600 focus:outline-none"
                           th:classappend="${#fields.hasErrors('endAt')} ? 'border-rose-500 bg-rose-50/40' : ''">
                    <p th:if="${#fields.hasErrors('endAt')}" th:errors="*{endAt}" class="mt-1 text-[11px] text-rose-600 font-medium"></p>
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3 border-t border-stone-100">
                <a th:href="@{/seller/vouchers}" class="px-4 py-2 border border-stone-300 rounded-xl text-xs font-semibold text-stone-600 hover:bg-stone-50 transition">
                    Hủy
                </a>
                <button type="submit" class="px-5 py-2 bg-primary-700 hover:bg-primary-800 text-white font-bold rounded-xl text-xs transition shadow-xs">
                    Lưu & Phát Hành Voucher
                </button>
            </div>
        </form>
    </div>
</div>
</html>
