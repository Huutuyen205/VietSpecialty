spring:
  application:
    name: vietspecialty
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vietspecialty?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Huutuyen123@}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: VietSpecialtyHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 40MB

  session:
    timeout: 30m
    cookie:
      http-only: true
      same-site: lax

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 2048

# =====================================================================
# Application Custom Properties
# =====================================================================
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  seed-demo: true
  admin:
    email: ${ADMIN_EMAIL:admin@vietspecialty.vn}
    password: ${ADMIN_PASSWORD:Admin@123456}

  shipping:
    standard-fee: 30000
    express-fee: 50000
    free-standard-threshold: 500000

  order:
    payment-timeout-minutes: 15
    auto-deliver-days: 7

  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-dir: ./uploads
    max-images-per-product: 8
    cloudinary-url: ${CLOUDINARY_URL:}

  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}
    process-on-return: true

  ai:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      timeout-seconds: 20
    chat:
      max-length: 500
      history-size: 10
      rate-limit: 15
      rate-window-minutes: 5

